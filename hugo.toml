baseURL = "https://small-atelier.github.io/studio-m/"
title = "Studio M"
languageCode = "en-us"

canonifyURLs = true
relativeURLs = false

# Commercial fonts in bundles are build inputs, never published
ignoreFiles = ['\.ttf$']

[[module.imports]]
path = "github.com/nunocoracao/blowfish/v2"

# Declaring any assets mount replaces the default, so assets/ is re-mounted explicitly.
[[module.mounts]]
source = "assets"
target = "assets"

# Blender scripts, published via the {{< script >}} shortcode
[[module.mounts]]
source = "blender"
target = "assets/blender"
files = ["! **/output*/**", "! **/__pycache__/**"]

[params]
subtitle = "Models and Minatures"
description = "Models and Minatures"

[params.sidebar]
emoji = "🎨"
subtitle = "Miniatures & Models"


