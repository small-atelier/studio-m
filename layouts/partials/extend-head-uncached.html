{{ if eq .Kind "page" }}
<script>
document.addEventListener('DOMContentLoaded', function () {
  var content = document.querySelector('.article-content');
  if (!content) return;
  var bar = document.createElement('div');
  bar.className = 'recipe-print-btn';
  var btn = document.createElement('button');
  btn.setAttribute('onclick', 'window.print()');
  btn.setAttribute('aria-label', 'Print or save as PDF');
  btn.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg> Print recipe';
  bar.appendChild(btn);
  content.parentNode.insertBefore(bar, content);
});
</script>
{{ end }}
