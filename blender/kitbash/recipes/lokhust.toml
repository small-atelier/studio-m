scale   = 0.7
out     = "+X"
up      = "+Z"
face    = "inner"
at      = [2.0, 0.0]
overlap = 0.3

[[part]]
name        = "arm"
file        = "hand.stl"
part_joint  = [52.350, 28.834, 36.245]   # ball r1.16
body_joint  = [4.63, -2.88, 3.09]        # left-shoulder cup r1.35
joint_r     = 1.35
offset      = [-1.5, 1.0, 1.5]           # 1.5mm in (towards the midline), 1mm back, 1.5mm up
fill_r      = 2.0                        # joint ball, same both shoulders
joint_margin = 2.0                       # pushed in: upper arm grazes the ribs out to ~3.4mm from the pivot (inspected)
rot         = { pitch = 15, yaw = 10, roll = 10 }

[[part]]
name        = "head"
file        = "Head.stl"
part_joint  = [0.003, 1.467, 1.163]      # cranium ball r1.65
body_joint  = [0.88, -5.61, 6.78]        # chest ring cup r2.03, opens forward (x on midline)
joint_r     = 2.03
offset      = [0.0, 1.0, 0.3]            # 1mm back, 0.3mm up: tucked into the collar
rest_rot    = { yaw = 7.5, pitch = -1.7, roll = 4.6 }   # mirror-symmetry fit of the head about the midline
rot         = { pitch = 10, yaw = 25, roll = 5 }
